# /etc/nginx/sites-available/portfolio
#
# Serves /var/www/portfolio/public as static files and proxies /api/*
# to the Node.js process listening on 127.0.0.1:3000.
#
# No domain name is configured yet, so this listens on the default vhost.
# Once you own a domain, replace every `server_name _;` with your domain
# and re-run Certbot (see DEPLOY.md).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/portfolio/public;
    index index.html;

    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"  always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long cache for hashed/static assets
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Admin panel — served as a static HTML file, the JS handles auth
    location = /admin {
        try_files /admin.html =404;
    }

    # API → Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Everything else: try a static file, then fall back to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Don't leak dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}